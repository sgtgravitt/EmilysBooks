<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelf & Spice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --ground:#F6EDEA; --surface:#FFFFFF; --surface-2:#FBF3F1;
    --ink:#2B161F; --ink-soft:#7C616B; --line:#E9D8D8;
    --accent:#9C1F3F; --accent-strong:#7A1731; --accent-soft:#F3D6DC;
    --gold:#9C7327; --gold-soft:#F1E2C6;
    --danger:#A8462B; --danger-soft:#F3DCD2;
    --shadow:rgba(43,22,31,.10);
    --font-display:'Fraunces',Georgia,'Iowan Old Style',serif;
    --font-body:'Karla',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-mono:'IBM Plex Mono','SFMono-Regular',Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#1B1013; --surface:#241318; --surface-2:#2B161C;
      --ink:#F5E8EC; --ink-soft:#C7A6AF; --line:#3B222A;
      --accent:#F0A7B8; --accent-strong:#F6C2CE; --accent-soft:#3E1E27;
      --gold:#E4BC7C; --gold-soft:#3A2E17;
      --danger:#E2836A; --danger-soft:#3C241C;
      --shadow:rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --ground:#1B1013; --surface:#241318; --surface-2:#2B161C;
    --ink:#F5E8EC; --ink-soft:#C7A6AF; --line:#3B222A;
    --accent:#F0A7B8; --accent-strong:#F6C2CE; --accent-soft:#3E1E27;
    --gold:#E4BC7C; --gold-soft:#3A2E17;
    --danger:#E2836A; --danger-soft:#3C241C;
    --shadow:rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  body{background:var(--ground);color:var(--ink);font-family:var(--font-body);margin:0;-webkit-tap-highlight-color:transparent;}
  button,input,select,textarea{font-family:inherit;color:inherit;}
  ::selection{background:var(--accent-soft);}
  .app-shell{
    max-width:480px;margin:0 auto;min-height:100dvh;background:var(--surface);
    display:flex;flex-direction:column;position:relative;
    box-shadow:0 0 60px var(--shadow);
  }
  a{color:var(--accent-strong);}

  .signin-screen{position:fixed;inset:0;background:var(--ground);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;}
  .signin-card{max-width:340px;text-align:center;}
  .signin-card .eyebrow{justify-content:center;}
  .signin-card h1{font-family:var(--font-display);font-size:25px;font-weight:600;margin:8px 0 10px;text-wrap:balance;}
  .signin-card p.section-hint{margin:0;}
  .signin-card .btn{width:100%;margin-top:20px;}
  .signin-error{color:var(--danger);font-size:12.5px;margin-top:12px;}

  /* Topbar */
  .topbar{
    position:sticky;top:0;z-index:5;background:var(--surface);
    border-bottom:1px solid var(--line);padding:18px 20px 14px;
  }
  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-strong);margin:0 0 2px;display:flex;align-items:center;gap:6px;}
  .topbar-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .topbar h1{font-family:var(--font-display);font-weight:600;font-size:26px;margin:0;text-wrap:balance;}
  .topbar-stat{font-family:var(--font-mono);font-size:13px;color:var(--ink-soft);white-space:nowrap;}
  .topbar-user-row{display:flex;justify-content:flex-end;margin-top:9px;}
  .user-chip{display:flex;align-items:center;gap:7px;cursor:pointer;background:none;border:none;padding:0;}
  .user-avatar{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex-shrink:0;object-fit:cover;}
  .user-name{font-size:11.5px;color:var(--ink-soft);font-weight:600;}

  main{flex:1;overflow-y:auto;padding:16px 20px 24px;}

  .banner-sample{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--ink-soft);
  }
  .banner-sample b{color:var(--ink);}

  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
  .stat-tile{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;}
  .stat-value{display:block;font-family:var(--font-mono);font-weight:600;font-size:18px;color:var(--accent-strong);font-variant-numeric:tabular-nums;}
  .stat-label{display:block;font-size:11px;color:var(--ink-soft);margin-top:3px;letter-spacing:.02em;}

  .section-title{font-family:var(--font-display);font-weight:600;font-size:16px;margin:20px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .section-hint{font-size:12.5px;color:var(--ink-soft);margin:-6px 0 12px;}

  .searchbar{
    display:flex;align-items:center;gap:8px;background:var(--surface-2);
    border:1px solid var(--line);border-radius:11px;padding:9px 12px;margin-bottom:12px;
  }
  .searchbar svg{width:16px;height:16px;color:var(--ink-soft);flex-shrink:0;}
  .searchbar input{border:none;background:none;outline:none;font-size:14.5px;width:100%;color:var(--ink);}
  .searchbar input::placeholder{color:var(--ink-soft);}

  .filter-row{display:flex;gap:14px;align-items:center;margin-bottom:12px;}
  .chiprow{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;flex:1;scrollbar-width:none;}
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;font-size:13px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink-soft);cursor:pointer;white-space:nowrap;font-weight:500;
    transition:background .12s,color .12s,border-color .12s;
  }
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .sortselect{
    flex-shrink:0;font-size:12.5px;border:1px solid var(--line);background:var(--surface);
    color:var(--ink-soft);border-radius:9px;padding:6px 8px;
  }

  .book-list{display:flex;flex-direction:column;gap:10px;}
  .book-card{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;
    cursor:pointer;transition:border-color .12s,transform .12s;
  }
  .book-card:active{transform:scale(.99);}
  .book-card.is-next{border-color:var(--accent);}
  .badge-next{
    display:inline-block;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    background:var(--accent);color:#fff;border-radius:6px;padding:2px 7px;margin-bottom:7px;
  }
  .book-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .book-thumb{width:42px;height:60px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--surface-2);}
  .book-thumb-placeholder{display:flex;align-items:center;justify-content:center;color:var(--line);}
  .book-thumb-placeholder svg{width:18px;height:18px;}
  .book-card-main{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .book-title{font-family:var(--font-display);font-weight:600;font-size:16.5px;margin:0;text-wrap:balance;}
  .book-sub{font-size:12.5px;color:var(--ink-soft);margin:2px 0 0;}
  .pill{
    flex-shrink:0;font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
    padding:3px 8px;border-radius:6px;font-weight:600;white-space:nowrap;
  }
  .pill-tbr{background:var(--gold-soft);color:var(--gold);}
  .pill-reading{background:var(--accent-soft);color:var(--accent-strong);}
  .pill-read{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);}
  .pill-dnf{background:var(--danger-soft);color:var(--danger);}

  .book-meta-row{display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap;}
  .icon-rating{display:flex;gap:1px;}
  .icon-rating svg{width:13px;height:13px;color:var(--line);}
  .icon-rating svg.filled{color:var(--gold);}
  .icon-spice{display:flex;gap:1px;}
  .icon-spice svg{width:13px;height:13px;color:var(--line);}
  .icon-spice svg.filled{color:var(--accent);}
  .meta-source{font-size:11px;color:var(--ink-soft);font-family:var(--font-mono);}

  .trope-chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
  .trope-chip{
    font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);
    color:var(--accent-strong);font-weight:600;
  }
  .trope-chip.is-gold{background:var(--gold-soft);color:var(--gold);}

  .attribution-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;}
  .added-by{font-size:11px;color:var(--ink-soft);}
  .recommend-btn{background:none;border:1px solid var(--line);color:var(--ink-soft);font-size:11px;font-weight:700;border-radius:999px;padding:4px 10px;cursor:pointer;display:flex;align-items:center;gap:4px;flex-shrink:0;}
  .recommend-btn svg{width:11px;height:11px;}
  .recommend-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);}
  .recommend-names{font-size:11px;color:var(--ink-soft);margin:5px 0 0;font-style:italic;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty-state svg{width:34px;height:34px;color:var(--line);margin-bottom:10px;}
  .empty-state p{font-size:13.5px;margin:0;}

  .trope-rank-list{display:flex;flex-direction:column;gap:8px;}
  .trope-rank-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;
    cursor:pointer;
  }
  .trope-rank-item.active{border-color:var(--accent);}
  .trope-rank-name{font-weight:600;font-size:14px;}
  .trope-rank-meta{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-soft);flex-shrink:0;}

  .match-group{margin-bottom:6px;}

  .external-card{
    background:var(--surface-2);border:1px dashed var(--line);border-radius:14px;padding:13px 14px;
  }
  .external-blurb{font-size:13px;color:var(--ink-soft);margin:6px 0 0;}
  .btn-add-small{
    flex-shrink:0;background:var(--surface);border:1px solid var(--accent);color:var(--accent-strong);
    font-size:11.5px;font-weight:700;border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap;
  }
  .external-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px;}
  .kindle-link{font-size:11.5px;font-weight:600;color:var(--ink-soft);text-decoration:none;border-bottom:1px dotted var(--ink-soft);white-space:nowrap;}
  .kindle-link:hover{color:var(--accent-strong);border-color:var(--accent-strong);}

  /* Leaderboard / rewards */
  .leaderboard-row{display:flex;align-items:center;gap:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;}
  .leaderboard-row.me{border-color:var(--accent);}
  .leaderboard-rank{font-family:var(--font-mono);font-weight:700;color:var(--ink-soft);width:16px;text-align:center;flex-shrink:0;}
  .leaderboard-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
  .leaderboard-info{flex:1;min-width:0;}
  .leaderboard-name{font-weight:700;font-size:14px;}
  .leaderboard-sub{font-size:11px;color:var(--ink-soft);font-family:var(--font-mono);}
  .leaderboard-points{font-family:var(--font-mono);font-weight:700;color:var(--accent-strong);font-size:16px;flex-shrink:0;text-align:right;}
  .leaderboard-points span{display:block;font-size:9.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}

  .badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .badge-item{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;}
  .badge-item.locked{opacity:.4;}
  .badge-icon{width:26px;height:26px;margin:0 auto 6px;color:var(--gold);}
  .badge-item.locked .badge-icon{color:var(--ink-soft);}
  .badge-name{font-weight:700;font-size:12.5px;}
  .badge-desc{font-size:10.5px;color:var(--ink-soft);margin-top:3px;}

  /* Bottom tab bar */
  .tabbar{
    position:sticky;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-around;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .tabbtn{
    background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--ink-soft);font-size:10px;font-weight:600;padding:4px 8px;cursor:pointer;
    letter-spacing:.01em;
  }
  .tabbtn svg{width:20px;height:20px;}
  .tabbtn.active{color:var(--accent-strong);}
  .tabbtn-add{
    background:var(--accent);color:#fff;width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;margin-top:-20px;
    box-shadow:0 4px 14px var(--shadow);flex-shrink:0;
  }
  .tabbtn-add svg{width:21px;height:21px;}
  .tabbtn-add span{display:none;}

  /* Sheet / modal */
  .sheet-overlay{
    position:fixed;inset:0;background:rgba(20,10,14,.44);display:flex;align-items:flex-end;
    justify-content:center;z-index:20;opacity:0;pointer-events:none;transition:opacity .18s;
  }
  .sheet-overlay.open{opacity:1;pointer-events:auto;}
  .sheet{
    width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;background:var(--surface);
    border-radius:22px 22px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(16px);transition:transform .18s;
  }
  .sheet-overlay.open .sheet{transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){ .sheet, .sheet-overlay{transition:none;} }
  .sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .sheet-header h2{font-family:var(--font-display);font-weight:600;font-size:19px;margin:0;}
  .sheet-close{background:var(--surface-2);border:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);}
  .sheet-close svg{width:15px;height:15px;}
  .sheet-note{font-size:12px;color:var(--ink-soft);font-style:italic;margin:2px 0 12px;}

  .form-row{margin-bottom:16px;}
  .suggestions{margin-top:6px;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .suggestion-item{display:block;width:100%;text-align:left;background:var(--surface-2);border:none;border-bottom:1px solid var(--line);padding:9px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink);}
  .suggestion-item:last-child{border-bottom:none;}
  .suggestion-item span{display:block;font-size:11.5px;font-weight:500;color:var(--ink-soft);margin-top:1px;}
  .suggestion-item.web-suggestion-item{display:flex;align-items:center;gap:10px;}
  .suggestion-cover{width:28px;height:40px;object-fit:cover;border-radius:4px;flex-shrink:0;background:var(--surface);}
  .suggestion-text{flex:1;min-width:0;}
  .suggestions-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--ink-soft);margin:10px 0 4px;}
  .label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:7px;}
  .input,.textarea{
    width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;
    padding:10px 12px;font-size:15px;outline:none;color:var(--ink);
  }
  .input:focus,.textarea:focus{border-color:var(--accent);}
  .textarea{resize:vertical;min-height:64px;font-family:var(--font-body);}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .segmented{display:flex;gap:6px;flex-wrap:wrap;}
  .segmented-btn{
    border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    padding:8px 12px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .segmented-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .picker-row{display:flex;gap:8px;}
  .picker-btn{background:none;border:none;padding:2px;cursor:pointer;}
  .picker-btn svg{width:26px;height:26px;color:var(--line);}
  .picker-btn svg.filled{color:var(--gold);}
  .picker-btn.spice svg.filled{color:var(--accent);}

  .trope-picker{display:flex;flex-wrap:wrap;gap:7px;}
  .trope-picker .chip{border-radius:999px;}
  .add-trope-row{display:flex;gap:8px;margin-top:10px;}
  .add-trope-row input{flex:1;}
  .add-trope-row button{
    background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:0 14px;
    font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;
  }

  .sheet-footer{display:flex;gap:10px;margin-top:6px;}
  .btn{
    border:none;border-radius:11px;padding:13px 18px;font-size:14.5px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn-primary{background:var(--accent);color:#fff;flex:1;}
  .btn-danger{background:var(--danger-soft);color:var(--danger);}
  .btn-ghost{background:var(--surface-2);color:var(--ink-soft);}
  .btn:focus-visible,.chip:focus-visible,.tabbtn:focus-visible,.segmented-btn:focus-visible,.picker-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  [hidden]{display:none!important;}
</style>
</head>
<body>

<div class="signin-screen" id="signin-screen">
  <div class="signin-card">
    <p class="eyebrow">Shelf &amp; Spice</p>
    <h1>Sign in to your family shelf</h1>
    <p class="section-hint">Track romance reads, tag tropes, and see what everyone in the family recommends.</p>
    <button class="btn btn-primary" id="google-signin-btn" type="button">Sign in with Google</button>
    <p class="signin-error" id="signin-error" hidden></p>
  </div>
</div>

<div class="app-shell" id="app-shell" hidden>
  <header class="topbar" id="topbar"></header>
  <main id="content"></main>
  <nav class="tabbar" id="tabbar">
    <button class="tabbtn" data-action="switch-tab" data-tab="shelf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="9" width="4" height="11" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><rect x="16.5" y="7" width="4" height="13" rx="1"/></svg>
      <span>Shelf</span>
    </button>
    <button class="tabbtn tabbtn-add" data-action="open-add" aria-label="Add a book">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>Add</span>
    </button>
    <button class="tabbtn" data-action="switch-tab" data-tab="recommend">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c.6 3.4 1.8 5.7 3.6 7.5 1.8 1.8 4.1 3 7.5 3.6-3.4.6-5.7 1.8-7.5 3.6-1.8 1.8-3 4.1-3.6 7.5-.6-3.4-1.8-5.7-3.6-7.5C6.6 15.4 4.3 14.2.9 13.6c3.4-.6 5.7-1.8 7.5-3.6 1.8-1.8 3-4.1 3.6-7.5z"/></svg>
      <span>Recommend</span>
    </button>
    <button class="tabbtn" data-action="switch-tab" data-tab="rewards">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9.5" r="6"/><path d="M8.2 14.8L6 21l6-2.8 6 2.8-2.2-6.2"/></svg>
      <span>Rewards</span>
    </button>
  </nav>
</div>

<div class="sheet-overlay" id="sheet-overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script type="module">
  // ============================================================
  // FIREBASE SETUP — paste your own project's config below.
  // Get this from: Firebase console > Project settings > General
  // > Your apps > SDK setup and configuration.
  // These values are not secret; access is controlled by the
  // Firestore security rules you set in the Firebase console, not

  var unsubBooks = null, unsubTropes = null;

  // ---------- auth ----------
  document.getElementById("google-signin-btn").addEventListener("click", function(){
    var errEl = document.getElementById("signin-error");
    errEl.hidden = true;
    signInWithPopup(auth, provider).catch(function(e){
      errEl.textContent = "Sign-in failed: " + (e && e.message ? e.message : "unknown error");
      errEl.hidden = false;
    });
  });

  onAuthStateChanged(auth, function(user){
    if(user){
      currentUser = { uid: user.uid, name: user.displayName || user.email || "Reader", photo: user.photoURL || "" };
      document.getElementById("signin-screen").hidden = true;
      document.getElementById("app-shell").hidden = false;
      subscribeData();
    } else {
      currentUser = null;
      document.getElementById("app-shell").hidden = true;
      document.getElementById("signin-screen").hidden = false;
      if(unsubBooks){ unsubBooks(); unsubBooks = null; }
      if(unsubTropes){ unsubTropes(); unsubTropes = null; }
    }
  });

  function subscribeData(){
    if(unsubBooks) unsubBooks();
    if(unsubTropes) unsubTropes();
    unsubBooks = onSnapshot(collection(dbase, "books"), function(snap){
      S.books = snap.docs.map(function(d){ return Object.assign({ id:d.id }, d.data()); });
      S.loaded = true;
      render();
    }, function(err){ console.warn("books snapshot error", err); S.loaded = true; render(); });
    unsubTropes = onSnapshot(doc(dbase, "meta", "tropes"), function(snap){
      S.customTropes = (snap.exists() && snap.data().list) || [];
      render();
    }, function(){});
  }

  // ---------- writes ----------
  function upsertBook(book){
    var isSample = book.id && String(book.id).indexOf("sample-") === 0;
    var id = (book.id && !isSample) ? book.id : uid();
    var existing = S.books.find(function(b){ return b.id === id; });
    var data = {
      title: book.title || "Untitled",
      author: book.author || "",
      series: book.series || "",
      status: book.status || "tbr",
      source: book.source || "",
      rating: book.rating || 0,
      spice: book.spice || 0,
      tropes: book.tropes || [],
      dateFinished: book.dateFinished || "",
      notes: book.notes || "",
      cover: book.cover || (existing ? (existing.cover || "") : ""),
      createdAt: book.createdAt || (existing ? existing.createdAt : new Date().toISOString()),
      addedBy: existing ? existing.addedBy : { uid: currentUser.uid, name: currentUser.name, photo: currentUser.photo },
      recommenders: existing ? (existing.recommenders || []) : []
    };
    var idx = S.books.findIndex(function(b){ return b.id === id; });
    var record = Object.assign({ id:id }, data);
    if(idx >= 0) S.books[idx] = record; else S.books.push(record);
    render();
    setDoc(doc(dbase, "books", id), data).catch(function(e){ console.warn("save failed", e); });
  }

  function removeBook(id){
    S.books = S.books.filter(function(b){ return b.id !== id; });
    render();
    deleteDoc(doc(dbase, "books", id)).catch(function(e){ console.warn("delete failed", e); });
  }

  function toggleRecommend(id){
    var b = S.books.find(function(x){ return x.id === id; });
    if(!b || !currentUser) return;
    var recommenders = (b.recommenders || []).slice();
    var idx = recommenders.findIndex(function(r){ return r.uid === currentUser.uid; });
    if(idx >= 0) recommenders.splice(idx, 1);
    else recommenders.push({ uid: currentUser.uid, name: currentUser.name });
    b.recommenders = recommenders;
    render();
    updateDoc(doc(dbase, "books", id), { recommenders: recommenders }).catch(function(e){ console.warn(e); });
  }

  function addCustomTrope(name){
    name = name.trim();
    if(!name) return null;
    var all = PRESET_TROPES.concat(S.customTropes);
    var existing = all.find(function(t){ return t.toLowerCase() === name.toLowerCase(); });
    if(existing) return existing;
    S.customTropes = S.customTropes.concat([name]);
    setDoc(doc(dbase, "meta", "tropes"), { list: S.customTropes }).catch(function(e){ console.warn(e); });
    return name;
  }

  // ---------- derived data ----------
  function effectiveBooks(){ return S.books.length ? S.books : SAMPLE_BOOKS; }
  function usingSamples(){ return S.books.length === 0; }
  function contributors(){
    var seen = {}, list = [];
    S.books.forEach(function(b){
      if(b.addedBy && !seen[b.addedBy.uid]){ seen[b.addedBy.uid] = true; list.push(b.addedBy); }
    });
    return list;
  }
  function allTropes(){
    var used = {};
    effectiveBooks().forEach(function(b){ (b.tropes||[]).forEach(function(t){ used[t] = (used[t]||0)+1; }); });
    var list = Object.keys(used).sort(function(a,b){ return used[b]-used[a] || a.localeCompare(b); });
    return { list: list, counts: used, picker: PRESET_TROPES.concat(S.customTropes.filter(function(t){ return PRESET_TROPES.indexOf(t) === -1; })) };
  }
  function tropeStats(){
    var stats = {};
    effectiveBooks().forEach(function(b){
      if(b.status !== "read" || !b.rating) return;
      (b.tropes||[]).forEach(function(t){
        if(!stats[t]) stats[t] = { count:0, sum:0 };
        stats[t].count++; stats[t].sum += b.rating;
      });
    });
    var arr = Object.keys(stats).map(function(t){ return { trope:t, count:stats[t].count, avg: stats[t].sum/stats[t].count }; });
    arr.sort(function(a,b){ return b.avg - a.avg || b.count - a.count; });
    return arr;
  }
  function overallStats(){
    var books = effectiveBooks();
    var read = books.filter(function(b){ return b.status === "read"; });
    var rated = read.filter(function(b){ return b.rating > 0; });
    var avg = rated.length ? (rated.reduce(function(s,b){ return s+b.rating; },0)/rated.length) : 0;
    var top = tropeStats()[0];
    return { readCount: read.length, avgRating: avg, topTrope: top ? top.trope : "—" };
  }
  function filteredBooks(){
    var f = S.filter;
    var list = effectiveBooks().filter(function(b){
      if(f.status !== "all" && b.status !== f.status) return false;
      if(f.trope && (b.tropes||[]).indexOf(f.trope) === -1) return false;
      if(f.person && (!b.addedBy || b.addedBy.uid !== f.person)) return false;
      if(f.search){
        var q = f.search.toLowerCase();
        var hay = (b.title+" "+b.author+" "+(b.series||"")).toLowerCase();
        if(hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    list.sort(function(a,b){
      if(f.sort === "title") return a.title.localeCompare(b.title);
      if(f.sort === "rating") return (b.rating||0) - (a.rating||0) || (b.dateFinished||"").localeCompare(a.dateFinished||"");
      return (b.dateFinished || b.createdAt || "").localeCompare(a.dateFinished || a.createdAt || "");
    });
    return list;
  }

  function amazonSearchUrl(title, author){
    var q = (title || "") + " " + (author || "");
    return "https://www.amazon.com/s?k=" + encodeURIComponent(q.trim()) + "&i=digital-text";
  }
  function externalMatches(trope, limit){
    var owned = {};
    S.books.forEach(function(b){ owned[(b.title+"|"+b.author).toLowerCase()] = true; });
    return EXTERNAL_BOOKS.filter(function(b){
      return b.tropes.indexOf(trope) !== -1 && !owned[(b.title+"|"+b.author).toLowerCase()];
    }).slice(0, limit || 6);
  }
  function quickAddExternal(idx){
    var b = EXTERNAL_BOOKS[idx];
    if(!b) return;
    openForm({
      title: b.title, author: b.author, series: "", status: "tbr",
      source: "Kindle Unlimited", rating: 0, spice: 0,
      tropes: b.tropes.slice(), dateFinished: "", notes: "", cover: ""
    });
  }

  // ---------- rewards ----------
  function computeFamilyStats(){
    var people = {};
    function ensure(uidk, name, photo){
      if(!people[uidk]) people[uidk] = { uid:uidk, name:name, photo:photo||"", booksRead:0, ratingsGiven:0, tropes:{}, recommendationsGiven:0, trend:0, spice5:0 };
      return people[uidk];
    }
    S.books.forEach(function(b){
      if(!b.addedBy) return;
      var p = ensure(b.addedBy.uid, b.addedBy.name, b.addedBy.photo);
      if(b.status === "read"){
        p.booksRead++;
        if(b.rating>0) p.ratingsGiven++;
        if(b.spice===5) p.spice5++;
        (b.tropes||[]).forEach(function(t){ p.tropes[t]=true; });
      }
      if((b.recommenders||[]).length >= 2) p.trend++;
    });
    S.books.forEach(function(b){
      (b.recommenders||[]).forEach(function(r){
        var p = ensure(r.uid, r.name, "");
        p.recommendationsGiven++;
      });
    });
    var arr = Object.keys(people).map(function(k){
      var p = people[k];
      p.tropeCount = Object.keys(p.tropes).length;
      p.points = p.booksRead*10 + p.ratingsGiven*5 + p.tropeCount*3 + p.recommendationsGiven*5;
      p.badges = BADGE_DEFS.filter(function(bd){ return bd.check(p); }).map(function(bd){ return bd.id; });
      return p;
    });
    arr.sort(function(a,b){ return b.points - a.points; });
    return arr;
  }

  // ---------- small renderers ----------
  function starsHTML(rating, cls){
    var out = "";
    for(var i=1;i<=5;i++) out += ICON.star.replace("<svg ", "<svg class=\"" + (cls||"") + (i<=rating?" filled":"") + "\" ");
    return out;
  }
  function flamesHTML(spice, cls){
    var out = "";
    for(var i=1;i<=5;i++) out += ICON.flame.replace("<svg ", "<svg class=\"" + (cls||"") + (i<=spice?" filled":"") + "\" ");
    return out;
  }
  function pillClass(status){ return "pill pill-" + status; }
  function coverThumbHTML(b){
    if(b.cover) return '<img class="book-thumb" src="' + esc(b.cover) + '" alt="">';
    return '<div class="book-thumb book-thumb-placeholder">' + ICON.book + '</div>';
  }

  function bookCardHTML(b, opts){
    opts = opts || {};
    var isRealBook = !b.sample && !opts.isCurated;
    var tropeChips = (b.tropes||[]).slice(0,5).map(function(t){
      return '<span class="trope-chip' + (opts.highlightTrope===t ? " is-gold":"") + '">' + esc(t) + "</span>";
    }).join("");
    var recommenders = b.recommenders || [];
    var iRecommend = currentUser && recommenders.some(function(r){ return r.uid === currentUser.uid; });
    var attribution = "";
    if(isRealBook && b.addedBy){
      attribution = '<div class="attribution-row"><span class="added-by">Added by ' + esc(b.addedBy.name) + '</span>' +
        '<button type="button" class="recommend-btn' + (iRecommend?" active":"") + '" data-action="toggle-recommend" data-id="' + esc(b.id) + '">' +
        (iRecommend ? ICON.check + " Recommended" : "+ Recommend") + '</button></div>' +
        (recommenders.length ? '<p class="recommend-names">Recommended by ' + esc(recommenders.map(function(r){ return r.name; }).join(", ")) + '</p>' : "");
    }
    return (
      '<div class="book-card' + (opts.isNext ? " is-next":"") + '" data-action="edit-book" data-id="' + esc(b.id) + '">' +
        (opts.isNext ? '<span class="badge-next">Read Next</span><br>' : "") +
        '<div class="book-card-head">' +
          coverThumbHTML(b) +
          '<div class="book-card-main">' +
            '<div><p class="book-title">' + esc(b.title) + '</p>' +
            '<p class="book-sub">' + esc(b.author || "Unknown author") + (b.series ? " &middot; " + esc(b.series) : "") + '</p></div>' +
            '<span class="' + pillClass(b.status) + '">' + STATUS_LABELS[b.status] + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="book-meta-row">' +
          '<span class="icon-rating">' + starsHTML(b.rating) + '</span>' +
          '<span class="icon-spice">' + flamesHTML(b.spice) + '</span>' +
          (b.source ? '<span class="meta-source">' + esc(b.source) + '</span>' : "") +
          (b.dateFinished ? '<span class="meta-source">' + fmtDate(b.dateFinished) + '</span>' : "") +
          '<a class="kindle-link" href="' + amazonSearchUrl(b.title, b.author) + '" target="_blank" rel="noopener">Find on Kindle &#8599;</a>' +
        '</div>' +
        (tropeChips ? '<div class="trope-chip-row">' + tropeChips + '</div>' : "") +
        attribution +
      '</div>'
    );
  }

  function externalCardHTML(b){
    var tropeChips = b.tropes.slice(0,4).map(function(t){ return '<span class="trope-chip">' + esc(t) + '</span>'; }).join("");
    return (
      '<div class="external-card">' +
        '<div class="book-card-head">' +
          '<div><p class="book-title">' + esc(b.title) + '</p>' +
          '<p class="book-sub">' + esc(b.author) + '</p></div>' +
        '</div>' +
        '<p class="external-blurb">' + esc(b.blurb) + '</p>' +
        '<div class="book-meta-row"><span class="icon-spice">' + flamesHTML(b.spice) + '</span><span class="meta-source">approx. spice</span></div>' +
        (tropeChips ? '<div class="trope-chip-row">' + tropeChips + '</div>' : "") +
        '<div class="external-actions">' +
          '<a class="kindle-link" href="' + amazonSearchUrl(b.title, b.author) + '" target="_blank" rel="noopener">Find on Kindle &#8599;</a>' +
          '<button type="button" class="btn-add-small" data-action="quick-add-external" data-idx="' + b.idx + '">+ Add to Shelf</button>' +
        '</div>' +
      '</div>'
    );
  }

  // ---------- topbar ----------
  function renderTopbar(){
    var titles = { shelf:"Your Shelf", recommend:"Recommend", rewards:"Rewards" };
    var stat = S.tab === "shelf" ? effectiveBooks().length + " books" : "";
    var userRow = "";
    if(currentUser){
      userRow = '<div class="topbar-user-row"><button type="button" class="user-chip" data-action="sign-out">' +
        (currentUser.photo ? '<img class="user-avatar" src="' + esc(currentUser.photo) + '" alt="">' : '<span class="user-avatar">' + esc(initials(currentUser.name)) + '</span>') +
        '<span class="user-name">' + esc(currentUser.name) + ' &middot; Sign out</span></button></div>';
    }
    document.getElementById("topbar").innerHTML =
      '<p class="eyebrow">Shelf &amp; Spice</p>' +
      '<div class="topbar-row"><h1>' + titles[S.tab] + '</h1><span class="topbar-stat">' + stat + '</span></div>' +
      userRow;
  }

  // ---------- shelf tab ----------
  function renderShelf(){
    var books = filteredBooks();
    var tropeInfo = allTropes();
    var people = contributors();
    var html = "";

    if(usingSamples()){
      html += '<div class="banner-sample"><span><b>Sample shelf.</b> Add your first read to replace these examples.</span></div>';
    }

    html += '<div class="searchbar">' + ICON.search + '<input type="text" id="search-input" placeholder="Search title, author, series" value="' + esc(S.filter.search) + '"></div>';

    html += '<div class="filter-row"><div class="chiprow" id="status-chips">';
    [["all","All"],["tbr","Want to Read"],["reading","Reading"],["read","Finished"],["dnf","DNF"]].forEach(function(pair){
      html += '<button class="chip' + (S.filter.status===pair[0]?" active":"") + '" data-action="set-status-filter" data-status="' + pair[0] + '">' + pair[1] + '</button>';
    });
    html += '</div><select class="sortselect" id="sort-select">' +
      '<option value="recent"' + (S.filter.sort==="recent"?" selected":"") + '>Recent</option>' +
      '<option value="rating"' + (S.filter.sort==="rating"?" selected":"") + '>Top rated</option>' +
      '<option value="title"' + (S.filter.sort==="title"?" selected":"") + '>Title A-Z</option>' +
      '</select></div>';

    if(people.length > 1){
      html += '<div class="chiprow" style="margin-bottom:12px;">';
      html += '<button class="chip' + (!S.filter.person?" active":"") + '" data-action="set-person-filter" data-person="">Everyone</button>';
      people.forEach(function(p){
        html += '<button class="chip' + (S.filter.person===p.uid?" active":"") + '" data-action="set-person-filter" data-person="' + esc(p.uid) + '">' + esc(p.name) + '</button>';
      });
      html += '</div>';
    }

    if(tropeInfo.list.length){
      html += '<div class="chiprow" style="margin-bottom:14px;">';
      html += '<button class="chip' + (!S.filter.trope?" active":"") + '" data-action="set-trope-filter" data-trope="">All tropes</button>';
      tropeInfo.list.forEach(function(t){
        html += '<button class="chip' + (S.filter.trope===t?" active":"") + '" data-action="set-trope-filter" data-trope="' + esc(t) + '">' + esc(t) + '</button>';
      });
      html += '</div>';
    }

    if(books.length){
      html += '<div class="book-list">' + books.map(function(b){ return bookCardHTML(b); }).join("") + '</div>';
    } else {
      html += '<div class="empty-state">' + ICON.book + '<p>No books match these filters.</p></div>';
    }

    document.getElementById("content").innerHTML = html;
  }

  // ---------- recommend tab ----------
  function renderRecommend(){
    var stats = overallStats();
    var ranks = tropeStats().slice(0,6);
    var books = effectiveBooks();
    var html = "";

    html += '<div class="stat-row">' +
      '<div class="stat-tile"><span class="stat-value">' + stats.readCount + '</span><span class="stat-label">Books read</span></div>' +
      '<div class="stat-tile"><span class="stat-value">' + (stats.avgRating ? stats.avgRating.toFixed(1) : "—") + '</span><span class="stat-label">Avg rating</span></div>' +
      '<div class="stat-tile"><span class="stat-value" style="font-size:13px;">' + esc(stats.topTrope) + '</span><span class="stat-label">Top trope</span></div>' +
      '</div>';

    html += '<h2 class="section-title">Family Top Tropes</h2>';
    if(ranks.length){
      html += '<p class="section-hint">Ranked by how the family rates finished books. Tap one to see matches.</p>';
      html += '<div class="trope-rank-list">' + ranks.map(function(r){
        return '<div class="trope-rank-item' + (S.recommendTrope===r.trope?" active":"") + '" data-action="set-recommend-trope" data-trope="' + esc(r.trope) + '">' +
          '<span class="trope-rank-name">' + esc(r.trope) + '</span>' +
          '<span class="trope-rank-meta"><span class="icon-rating">' + starsHTML(Math.round(r.avg)) + '</span>' + r.count + ' book' + (r.count===1?"":"s") + '</span>' +
        '</div>';
      }).join("") + '</div>';
    } else {
      html += '<p class="section-hint">Rate a few finished books to see favorite tropes here.</p>';
    }

    var tropeInfo = allTropes();
    html += '<h2 class="section-title">Browse by Trope</h2>';
    html += '<div class="chiprow" style="margin-bottom:14px;">' + tropeInfo.list.map(function(t){
      return '<button class="chip' + (S.recommendTrope===t?" active":"") + '" data-action="set-recommend-trope" data-trope="' + esc(t) + '">' + esc(t) + ' &middot; ' + tropeInfo.counts[t] + '</button>';
    }).join("") + '</div>';

    if(!S.recommendTrope && ranks.length) S.recommendTrope = ranks[0].trope;
    else if(!S.recommendTrope && tropeInfo.list.length) S.recommendTrope = tropeInfo.list[0];

    if(S.recommendTrope){
      var t = S.recommendTrope;
      var matchNext = books.filter(function(b){ return b.status === "tbr" && (b.tropes||[]).indexOf(t) !== -1; });
      var matchRead = books.filter(function(b){ return b.status === "read" && (b.tropes||[]).indexOf(t) !== -1; })
        .sort(function(a,b){ return (b.rating||0)-(a.rating||0); });
      var matchExternal = externalMatches(t, 6);

      if(matchNext.length){
        html += '<div class="match-group"><h2 class="section-title">Read Next</h2><div class="book-list">' +
          matchNext.map(function(b){ return bookCardHTML(b, { isNext:true, highlightTrope:t }); }).join("") + '</div></div>';
      }
      if(matchRead.length){
        html += '<div class="match-group"><h2 class="section-title">The Family Loved These</h2><div class="book-list">' +
          matchRead.map(function(b){ return bookCardHTML(b, { highlightTrope:t }); }).join("") + '</div></div>';
      }
      if(!matchNext.length && !matchRead.length){
        html += '<p class="section-hint">No books tagged “' + esc(t) + '” yet.</p>';
      }

      html += '<div class="match-group"><h2 class="section-title">Discover New: “' + esc(t) + '”</h2>' +
        '<p class="section-hint">Curated picks from popular romance releases &mdash; tropes are general reader consensus, so double-check before you dive in.</p>';
      if(matchExternal.length){
        html += '<div class="book-list">' + matchExternal.map(externalCardHTML).join("") + '</div>';
      } else {
        html += '<p class="section-hint">No curated picks for this trope yet &mdash; try another one above.</p>';
      }
      html += '</div>';
    } else {
      html += '<p class="section-hint">Pick a trope above to see matches.</p>';
    }

    document.getElementById("content").innerHTML = html;
  }

  // ---------- rewards tab ----------
  function renderRewards(){
    var stats = computeFamilyStats();
    var html = "";

    html += '<h2 class="section-title">Family Leaderboard</h2>';
    if(!stats.length){
      html += '<div class="empty-state">' + ICON.medal + '<p>Finish your first book to start earning points.</p></div>';
    } else {
      html += stats.map(function(p, i){
        var isMe = currentUser && p.uid === currentUser.uid;
        return '<div class="leaderboard-row' + (isMe?" me":"") + '">' +
          '<span class="leaderboard-rank">' + (i+1) + '</span>' +
          (p.photo ? '<img class="leaderboard-avatar" src="' + esc(p.photo) + '" alt="">' : '<span class="leaderboard-avatar">' + esc(initials(p.name)) + '</span>') +
          '<div class="leaderboard-info"><div class="leaderboard-name">' + esc(p.name) + (isMe ? " (you)" : "") + '</div>' +
          '<div class="leaderboard-sub">' + p.booksRead + ' read &middot; ' + p.badges.length + ' badges</div></div>' +
          '<div class="leaderboard-points">' + p.points + '<span>pts</span></div>' +
        '</div>';
      }).join("");
    }

    var mine = stats.find(function(p){ return currentUser && p.uid === currentUser.uid; }) || { booksRead:0, ratingsGiven:0, tropeCount:0, recommendationsGiven:0, spice5:0, trend:0, badges:[] };
    html += '<h2 class="section-title">Your Badges</h2>';
    html += '<div class="badge-grid">' + BADGE_DEFS.map(function(b){
      var earned = mine.badges.indexOf(b.id) !== -1;
      return '<div class="badge-item' + (earned?"":" locked") + '">' +
        '<div class="badge-icon">' + ICON.medal + '</div>' +
        '<div class="badge-name">' + esc(b.name) + '</div>' +
        '<div class="badge-desc">' + esc(b.desc) + '</div>' +
      '</div>';
    }).join("") + '</div>';
    html += '<p class="section-hint" style="margin-top:14px;">Points: 10 per book finished, 5 per rating given, 3 per unique trope explored, 5 per family recommend your adds receive.</p>';

    document.getElementById("content").innerHTML = html;
  }

  // ---------- sheet (add/edit) ----------
  function openForm(book){
    var prefill = !!book;
    var isEdit = !!(book && book.id);
    var isSample = isEdit && String(book.id).indexOf("sample-") === 0;
    FS = {
      id: isEdit ? book.id : null,
      isSample: isSample,
      createdAt: isEdit ? book.createdAt : null,
      title: prefill ? (book.title||"") : "",
      author: prefill ? (book.author||"") : "",
      series: prefill ? (book.series||"") : "",
      status: prefill ? (book.status||"tbr") : "tbr",
      source: prefill ? (book.source||"Kindle Unlimited") : "Kindle Unlimited",
      rating: prefill ? (book.rating||0) : 0,
      spice: prefill ? (book.spice||0) : 0,
      tropes: prefill ? (book.tropes||[]).slice() : [],
      dateFinished: prefill ? (book.dateFinished||"") : "",
      notes: prefill ? (book.notes||"") : "",
      cover: prefill ? (book.cover||"") : ""
    };
    renderSheet();
    document.getElementById("sheet-overlay").classList.add("open");
  }
  function closeForm(){
    document.getElementById("sheet-overlay").classList.remove("open");
    FS = null;
  }

  function renderSheet(){
    if(!FS) return;
    var tropeInfo = allTropes();
    var html = "";
    html += '<div class="sheet-header"><h2>' + (FS.id ? "Edit Book" : "Add a Book") + '</h2>' +
      '<button class="sheet-close" data-action="close-sheet">' + ICON.x + '</button></div>';
    if(FS.isSample) html += '<p class="sheet-note">This is example data &mdash; saving adds it as a real book on your shelf.</p>';

    html += '<form id="book-form">';
    html += '<div class="form-row"><label class="label" for="f-title">Title</label><input class="input" id="f-title" required autocomplete="off" value="' + esc(FS.title) + '" placeholder="Search or type a title">' +
      '<div class="suggestions" id="curated-suggestions" hidden></div>' +
      '<div id="web-suggestions-wrap" hidden><p class="suggestions-label">From Open Library</p><div class="suggestions" id="web-suggestions"></div></div>' +
      '</div>';
    html += '<div class="two-col">' +
      '<div class="form-row"><label class="label" for="f-author">Author</label><input class="input" id="f-author" value="' + esc(FS.author) + '" placeholder="Author"></div>' +
      '<div class="form-row"><label class="label" for="f-series">Series</label><input class="input" id="f-series" value="' + esc(FS.series) + '" placeholder="Optional"></div>' +
    '</div>';

    html += '<div class="form-row"><label class="label">Status</label><div class="segmented" id="status-segmented">' +
      Object.keys(STATUS_LABELS).map(function(k){ return '<button type="button" class="segmented-btn' + (FS.status===k?" active":"") + '" data-status="' + k + '">' + STATUS_LABELS[k] + '</button>'; }).join("") +
      '</div></div>';

    html += '<div class="form-row"><label class="label">Rating</label><div class="picker-row" id="rating-picker">' +
      [1,2,3,4,5].map(function(i){ return '<button type="button" class="picker-btn" data-value="' + i + '">' + ICON.star.replace("<svg ", "<svg class=\"" + (i<=FS.rating?"filled":"") + "\" ") + '</button>'; }).join("") +
    '</div></div>';

    html += '<div class="form-row"><label class="label">Spice</label><div class="picker-row" id="spice-picker">' +
      [1,2,3,4,5].map(function(i){ return '<button type="button" class="picker-btn spice" data-value="' + i + '">' + ICON.flame.replace("<svg ", "<svg class=\"" + (i<=FS.spice?"filled":"") + "\" ") + '</button>'; }).join("") +
    '</div></div>';

    html += '<div class="two-col">' +
      '<div class="form-row"><label class="label" for="f-date">Date finished</label><input class="input" type="date" id="f-date" value="' + esc(FS.dateFinished) + '"></div>' +
      '<div class="form-row"><label class="label">Source</label><select class="input" id="f-source">' +
        SOURCES.map(function(s){ return '<option' + (FS.source===s?" selected":"") + '>' + s + '</option>'; }).join("") +
      '</select></div>' +
    '</div>';

    html += '<div class="form-row"><label class="label">Tropes</label><div class="trope-picker" id="trope-picker">' +
      tropeInfo.picker.map(function(t){ return '<button type="button" class="chip' + (FS.tropes.indexOf(t)!==-1?" active":"") + '" data-trope="' + esc(t) + '">' + esc(t) + '</button>'; }).join("") +
      '</div>' +
      '<div class="add-trope-row"><input class="input" id="f-custom-trope" placeholder="Add a custom trope&hellip;"><button type="button" id="add-trope-btn">Add</button></div>' +
    '</div>';

    html += '<div class="form-row"><label class="label" for="f-notes">Notes</label><textarea class="textarea" id="f-notes" placeholder="Thoughts, favorite quotes, warnings&hellip;">' + esc(FS.notes) + '</textarea></div>';

    html += '<div class="sheet-footer">';
    if(FS.id) html += '<button type="button" class="btn btn-danger" id="delete-btn">Delete</button>';
    html += '<button type="submit" class="btn btn-primary">' + (FS.id ? "Save Changes" : "Add to Shelf") + '</button>';
    html += '</div></form>';

    document.getElementById("sheet").innerHTML = html;
    bindSheetEvents();
  }

  function bindSheetEvents(){
    var sheet = document.getElementById("sheet");

    var titleInput = document.getElementById("f-title");
    var curatedBox = document.getElementById("curated-suggestions");
    var webWrap = document.getElementById("web-suggestions-wrap");
    var webBox = document.getElementById("web-suggestions");
    var webTimer = null;

    function fetchWebSuggestions(q){
      fetch("https://openlibrary.org/search.json?q=" + encodeURIComponent(q) + "&limit=6&fields=title,author_name,cover_i,first_publish_year")
        .then(function(r){ return r.json(); })
        .then(function(data){
          var docs = (data.docs || []).filter(function(d){ return d.title; }).slice(0, 6);
          if(!docs.length){ webWrap.hidden = true; webBox.innerHTML = ""; return; }
          webBox.innerHTML = docs.map(function(d){
            var author = (d.author_name && d.author_name[0]) || "Unknown author";
            var cover = d.cover_i ? ("https://covers.openlibrary.org/b/id/" + d.cover_i + "-S.jpg") : "";
            return '<button type="button" class="suggestion-item web-suggestion-item" data-title="' + esc(d.title) + '" data-author="' + esc(author) + '" data-cover="' + esc(cover) + '">' +
              (cover ? '<img class="suggestion-cover" src="' + cover + '" alt="">' : '<span class="suggestion-cover"></span>') +
              '<span class="suggestion-text">' + esc(d.title) + '<span>' + esc(author) + (d.first_publish_year ? " &middot; " + d.first_publish_year : "") + '</span></span>' +
            '</button>';
          }).join("");
          webWrap.hidden = false;
        })
        .catch(function(){ webWrap.hidden = true; webBox.innerHTML = ""; });
    }

    titleInput.addEventListener("input", function(){
      var q = titleInput.value.trim();
      var ql = q.toLowerCase();
      if(ql.length < 2){ curatedBox.hidden = true; curatedBox.innerHTML = ""; }
      else {
        var matches = EXTERNAL_BOOKS.filter(function(b){ return b.title.toLowerCase().indexOf(ql) !== -1; }).slice(0,5);
        if(!matches.length){ curatedBox.hidden = true; curatedBox.innerHTML = ""; }
        else {
          curatedBox.innerHTML = matches.map(function(b){
            return '<button type="button" class="suggestion-item" data-idx="' + b.idx + '">' + esc(b.title) + '<span>' + esc(b.author) + ' &middot; has tropes tagged</span></button>';
          }).join("");
          curatedBox.hidden = false;
        }
      }
      clearTimeout(webTimer);
      if(q.length < 3){ webWrap.hidden = true; webBox.innerHTML = ""; return; }
      webTimer = setTimeout(function(){ fetchWebSuggestions(q); }, 400);
    });
    titleInput.addEventListener("blur", function(){ setTimeout(function(){ curatedBox.hidden = true; webWrap.hidden = true; }, 150); });

    curatedBox.addEventListener("click", function(e){
      var item = e.target.closest(".suggestion-item"); if(!item) return;
      var b = EXTERNAL_BOOKS[Number(item.getAttribute("data-idx"))];
      if(!b) return;
      titleInput.value = b.title;
      document.getElementById("f-author").value = b.author;
      FS.spice = b.spice;
      sheet.querySelectorAll("#spice-picker .picker-btn").forEach(function(btn,i){ btn.querySelector("svg").classList.toggle("filled", (i+1) <= FS.spice); });
      FS.tropes = b.tropes.slice();
      sheet.querySelectorAll("#trope-picker .chip").forEach(function(chip){
        chip.classList.toggle("active", FS.tropes.indexOf(chip.getAttribute("data-trope")) !== -1);
      });
      curatedBox.hidden = true; curatedBox.innerHTML = "";
    });

    webBox.addEventListener("click", function(e){
      var item = e.target.closest(".web-suggestion-item"); if(!item) return;
      titleInput.value = item.getAttribute("data-title");
      document.getElementById("f-author").value = item.getAttribute("data-author");
      FS.cover = item.getAttribute("data-cover") || "";
      webWrap.hidden = true; webBox.innerHTML = "";
    });

    document.getElementById("status-segmented").addEventListener("click", function(e){
      var btn = e.target.closest(".segmented-btn"); if(!btn) return;
      FS.status = btn.getAttribute("data-status");
      sheet.querySelectorAll("#status-segmented .segmented-btn").forEach(function(b){ b.classList.toggle("active", b===btn); });
    });

    document.getElementById("rating-picker").addEventListener("click", function(e){
      var btn = e.target.closest(".picker-btn"); if(!btn) return;
      var v = Number(btn.getAttribute("data-value"));
      FS.rating = (FS.rating === v) ? 0 : v;
      sheet.querySelectorAll("#rating-picker .picker-btn").forEach(function(b,i){ b.querySelector("svg").classList.toggle("filled", (i+1) <= FS.rating); });
    });

    document.getElementById("spice-picker").addEventListener("click", function(e){
      var btn = e.target.closest(".picker-btn"); if(!btn) return;
      var v = Number(btn.getAttribute("data-value"));
      FS.spice = (FS.spice === v) ? 0 : v;
      sheet.querySelectorAll("#spice-picker .picker-btn").forEach(function(b,i){ b.querySelector("svg").classList.toggle("filled", (i+1) <= FS.spice); });
    });

    document.getElementById("trope-picker").addEventListener("click", function(e){
      var chip = e.target.closest(".chip"); if(!chip) return;
      var t = chip.getAttribute("data-trope");
      var idx = FS.tropes.indexOf(t);
      if(idx === -1) FS.tropes.push(t); else FS.tropes.splice(idx,1);
      chip.classList.toggle("active");
    });

    document.getElementById("add-trope-btn").addEventListener("click", function(){
      var input = document.getElementById("f-custom-trope");
      var name = addCustomTrope(input.value);
      if(!name) return;
      input.value = "";
      if(FS.tropes.indexOf(name) === -1) FS.tropes.push(name);
      var picker = document.getElementById("trope-picker");
      var existingChip = Array.prototype.find.call(picker.querySelectorAll(".chip"), function(c){ return c.getAttribute("data-trope") === name; });
      if(!existingChip){
        picker.insertAdjacentHTML("beforeend", '<button type="button" class="chip active" data-trope="' + esc(name) + '">' + esc(name) + '</button>');
      } else {
        existingChip.classList.add("active");
      }
    });

    document.getElementById("f-custom-trope").addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); document.getElementById("add-trope-btn").click(); }
    });

    if(document.getElementById("delete-btn")){
      document.getElementById("delete-btn").addEventListener("click", function(){
        if(!FS.isSample) removeBook(FS.id);
        closeForm();
      });
    }

    document.getElementById("book-form").addEventListener("submit", function(e){
      e.preventDefault();
      var title = document.getElementById("f-title").value.trim();
      if(!title) return;
      upsertBook({
        id: FS.id, createdAt: FS.createdAt,
        title: title,
        author: document.getElementById("f-author").value.trim(),
        series: document.getElementById("f-series").value.trim(),
        status: FS.status,
        source: document.getElementById("f-source").value,
        rating: FS.rating,
        spice: FS.spice,
        tropes: FS.tropes,
        dateFinished: document.getElementById("f-date").value,
        notes: document.getElementById("f-notes").value.trim(),
        cover: FS.cover
      });
      closeForm();
      S.tab = "shelf";
      render();
    });
  }

  // ---------- master render ----------
  function render(){
    renderTopbar();
    if(S.tab === "shelf") renderShelf();
    else if(S.tab === "recommend") renderRecommend();
    else renderRewards();
    document.querySelectorAll("#tabbar .tabbtn[data-tab]").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-tab") === S.tab);
    });
  }

  // ---------- global event delegation ----------
  document.addEventListener("click", function(e){
    var actionEl = e.target.closest("[data-action]");
    if(!actionEl) return;
    if(actionEl.classList.contains("kindle-link")) return;
    var action = actionEl.getAttribute("data-action");
    if(action === "switch-tab"){
      S.tab = actionEl.getAttribute("data-tab");
      render();
    } else if(action === "open-add"){
      openForm(null);
    } else if(action === "edit-book"){
      var id = actionEl.getAttribute("data-id");
      var book = effectiveBooks().find(function(b){ return b.id === id; });
      if(book) openForm(book);
    } else if(action === "close-sheet"){
      closeForm();
    } else if(action === "set-status-filter"){
      S.filter.status = actionEl.getAttribute("data-status");
      renderShelf();
    } else if(action === "set-trope-filter"){
      var tv = actionEl.getAttribute("data-trope");
      S.filter.trope = tv || null;
      renderShelf();
    } else if(action === "set-person-filter"){
      var pv = actionEl.getAttribute("data-person");
      S.filter.person = pv || null;
      renderShelf();
    } else if(action === "set-recommend-trope"){
      var rt = actionEl.getAttribute("data-trope");
      S.recommendTrope = (S.recommendTrope === rt) ? null : rt;
      renderRecommend();
    } else if(action === "quick-add-external"){
      quickAddExternal(Number(actionEl.getAttribute("data-idx")));
    } else if(action === "toggle-recommend"){
      toggleRecommend(actionEl.getAttribute("data-id"));
    } else if(action === "sign-out"){
      signOut(auth);
    }
  });

  document.getElementById("sheet-overlay").addEventListener("click", function(e){
    if(e.target.id === "sheet-overlay") closeForm();
  });

  document.addEventListener("input", function(e){
    if(e.target.id === "search-input"){
      S.filter.search = e.target.value;
      renderShelfBooksOnly();
    }
  });
  function renderShelfBooksOnly(){
    var books = filteredBooks();
    var listEl = document.querySelector("#content .book-list");
    var emptyEl = document.querySelector("#content .empty-state");
    if(listEl && books.length){ listEl.innerHTML = books.map(function(b){ return bookCardHTML(b); }).join(""); return; }
    renderShelf();
  }

  document.addEventListener("change", function(e){
    if(e.target.id === "sort-select"){
      S.filter.sort = e.target.value;
      renderShelf();
    }
  });

  render();
</script>
</body>
</html>
